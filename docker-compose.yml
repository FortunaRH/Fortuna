services:
  app:
    build:
      context: ./app
      args:
        NEXT_PUBLIC_ENTROPY_ADDRESS: ${NEXT_PUBLIC_ENTROPY_ADDRESS}
        NEXT_PUBLIC_COINFLIP_ADDRESS: ${NEXT_PUBLIC_COINFLIP_ADDRESS}
        NEXT_PUBLIC_PROVIDER_ADDRESS: ${NEXT_PUBLIC_PROVIDER_ADDRESS}
        NEXT_PUBLIC_NFT_ADDRESS: ${NEXT_PUBLIC_NFT_ADDRESS}
        NEXT_PUBLIC_POOL_ADDRESS: ${NEXT_PUBLIC_POOL_ADDRESS}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
    environment:
      RPC_URL: ${RPC_URL:-https://rpc.mainnet.chain.robinhood.com}
    ports:
      - "3000:3000"
    restart: unless-stopped
